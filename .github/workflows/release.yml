name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    environment: release
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm ci
      - run: dotnet restore Transiever.Common.slnx
      - run: dotnet build Transiever.Common.slnx --configuration Release --no-restore
      - run: dotnet test Transiever.Common.slnx --configuration Release --no-build
      - uses: NuGet/login@v1
        id: nuget-login
        with: { user: ${{ vars.NUGET_USER }} }
      - env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}, NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }} }
        run: npx semantic-release
