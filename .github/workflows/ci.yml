name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, "codex/**"]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore Transiever.Common.slnx
      - run: dotnet build Transiever.Common.slnx --configuration Release --no-restore
      - run: dotnet test Transiever.Common.slnx --configuration Release --no-build
      - run: dotnet pack src/Transiever.Common.Accounts/Transiever.Common.Accounts.csproj --configuration Release --no-build --output out
